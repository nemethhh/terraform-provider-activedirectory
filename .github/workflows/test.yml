name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      # `make check` is build, vet, gofmt and test, in this order. Running the
      # target rather than the four commands keeps CI and a developer's machine
      # from drifting apart: a bare `gofmt -l .` passes here only because the
      # gitignored docs/reference clones are absent from a fresh checkout, and
      # fails on any working copy that has them.
      - run: make check
